<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Ice Sistema — Gestão para negócios gelados</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- logo vetorial (floco + circuito) reutilizada por <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- userSpaceOnUse: sem isso, linhas perfeitamente retas (bbox zero) somem -->
      <linearGradient id="gold" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e8c96a" /><stop offset="1" stop-color="#b8912e" />
      </linearGradient>
      <g id="ice-logo-mark">
        <g stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round">
          <!-- metade floco de neve (esquerda) -->
          <line x1="50" y1="10" x2="50" y2="90" />
          <line x1="50" y1="50" x2="16" y2="30" />
          <line x1="50" y1="50" x2="16" y2="70" />
          <line x1="38" y1="43" x2="30" y2="33" /><line x1="38" y1="43" x2="27" y2="46" />
          <line x1="38" y1="57" x2="30" y2="67" /><line x1="38" y1="57" x2="27" y2="54" />
          <line x1="50" y1="24" x2="41" y2="18" /><line x1="50" y1="76" x2="41" y2="82" />
          <!-- metade circuito (direita): hexágono com nós -->
          <path d="M56 22 L82 22 L90 38 L90 62 L82 78 L56 78" />
          <line x1="56" y1="36" x2="72" y2="36" /><line x1="56" y1="64" x2="72" y2="64" />
          <line x1="72" y1="36" x2="72" y2="50" /><line x1="72" y1="50" x2="62" y2="50" />
        </g>
        <g fill="url(#gold)">
          <circle cx="82" cy="22" r="5" /><circle cx="82" cy="78" r="5" />
          <circle cx="72" cy="36" r="4.5" /><circle cx="72" cy="64" r="4.5" />
          <circle cx="62" cy="50" r="4.5" />
        </g>
      </g>
    </defs>
  </svg>

  <!-- ============ LOGIN ============ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 100 100"><use href="#ice-logo-mark" /></svg>
        <div class="lt"><strong>ICE SISTEMA</strong><small>SaaS · Gestão gelada</small></div>
      </div>
      <div class="login-tag">Gestão completa para gelo saborizado, sorvetes e bebidas geladas — no navegador, offline e na nuvem.</div>

      <div id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="voce@empresa.com" />
        <label>Senha</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••" />
        <label>Código de convite (opcional, só pra conta nova)</label>
        <input id="login-ref" placeholder="Ex: A1B2C3" maxlength="12" style="text-transform:uppercase" />
        <div class="login-msg" id="login-msg"></div>
        <div class="grid" style="gap:8px">
          <button class="btn primary" id="btn-login">Entrar</button>
          <button class="btn" id="btn-signup">Criar conta da minha empresa</button>
        </div>
      </div>
      <div id="login-nocloud" style="display:none">
        <div class="banner info" style="margin-top:4px">☁️ Nuvem não configurada nesta instalação (veja o README). Você pode usar o sistema 100% offline neste aparelho.</div>
      </div>
      <!-- modo offline: só aparece em instalações SEM nuvem configurada -->
      <div class="login-sep" id="login-sep">ou</div>
      <button class="btn ghost" id="btn-offline" style="width:100%">📴 Usar offline neste aparelho (sem nuvem)</button>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="blogo" id="brand-logo">❄️</div>
        <div><div class="bname" id="brand-name">Ice Sistema</div><div class="btag" id="brand-tag"></div></div>
      </div>
      <nav class="menu" id="menu-desktop"></nav>
      <div class="profile-row" id="profile-side" style="display:none">
        <span class="ava" data-ava></span><span class="pname" data-pname></span>
      </div>
      <div class="sync-foot" id="sync-foot">—</div>
    </aside>

    <div style="flex:1;min-width:0">
      <div class="topbar">
        <div class="tb-row">
          <div class="blogo" id="brand-logo-m">❄️</div>
          <div class="bname" id="brand-name-m">Ice Sistema</div>
          <div class="sync-dot" id="sync-foot-m">—</div>
          <button id="btn-drawer" aria-label="Abrir menu">☰</button>
        </div>
      </div>
      <div class="subtabs" id="subtabs" style="display:none"></div>
      <main id="view"></main>
    </div>
  </div>

  <!-- gaveta de navegação (mobile) -->
  <div id="drawer-back"></div>
  <aside id="drawer" aria-label="Menu">
    <div class="brand">
      <div class="blogo" id="brand-logo-d">❄️</div>
      <div><div class="bname" id="brand-name-d">Ice Sistema</div><div class="btag" id="brand-tag-d"></div></div>
      <button id="btn-drawer-close" aria-label="Fechar menu">✕</button>
    </div>
    <nav class="menu" id="menu-drawer"></nav>
    <div class="profile-row" id="profile-drawer" style="display:none">
      <span class="ava" data-ava></span><span class="pname" data-pname></span>
    </div>
    <div class="sync-foot" id="sync-foot-d">—</div>
  </aside>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/geo.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/views-dashboard.js"></script>
  <script src="js/views-vendas.js"></script>
  <script src="js/views-crm.js"></script>
  <script src="js/views-producao.js"></script>
  <script src="js/views-insumos.js"></script>
  <script src="js/views-receitas.js"></script>
  <script src="js/views-mapa.js"></script>
  <script src="js/views-assistente.js"></script>
  <script src="js/views-financeiro.js"></script>
  <script src="js/views-extras.js"></script>
  <script src="js/views-assinatura.js"></script>
  <script src="js/views-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
